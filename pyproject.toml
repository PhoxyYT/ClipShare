[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "clipshare-linux"
version = "0.1.0"
description = "A local-first Qt desktop utility for gaming clips"
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials>=6.8,<6.9", "PySide6-Addons>=6.8,<6.9", "watchdog>=4,<7", "requests>=2.32,<3"]
license = "MIT"
[project.scripts]
clipshare = "clipshare.app:main"
[tool.setuptools]
packages = ["clipshare"]
[tool.pytest.ini_options]
testpaths = ["tests"]
